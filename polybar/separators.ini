[glyph]
gleft = 
gright = 

[module/sep]
type = custom/text
content = ""
content-padding = 1
content-foreground = ${color.yellow}

;;
;; Separator modules right
;;

[module/sep-left-1]
type = custom/text
content = ${glyph.gleft}
content-font = 2
content-foreground = ${color.orange}
content-background = ${color.background}

;;
;; Separator modules right
;;

[module/sep-right-1]
type = custom/text
content = ${glyph.gright}
content-font = 2
content-foreground = ${color.red}
content-background = ${color.aqua}

[module/sep-right-2]
type = custom/text
content = ${glyph.gright}
content-font = 2
content-foreground = ${color.aqua}
content-background = ${color.background}
