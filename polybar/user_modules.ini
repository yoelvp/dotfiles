[module/bluetooth]
type = custom/script
exec = $HOME/dotfiles/polybar/scripts/bluetooth.sh
interval = 5
click-left = alacritty -e bluetui

click-right = $HOME/dotfiles/polybar/scripts/bluetooth-toggle.sh

[module/user_network]
type = custom/ipc
hook-0 = $HOME/dotfiles/polybar/scripts/network.sh icon
hook-1 = $HOME/dotfiles/polybar/scripts/network.sh text
initial = 1
click-left = $HOME/dotfiles/polybar/scripts/network-toggle.sh
click-right = alacritty -e nmtui

[module/volume]
type = custom/ipc
hook-0 = $HOME/dotfiles/Scripts/audio/polybar-module.sh
initial = 1
click-left = $HOME/dotfiles/Scripts/audio/polybar-module.sh
scroll-up = $HOME/dotfiles/Scripts/audio/volume-up.sh
scroll-down = $HOME/dotfiles/Scripts/audio/volume-down.sh
; click-right = alacritty -e nmtui

[module/brightness]
type = custom/ipc
exec = $HOME/dotfiles/polybar/scripts/brightness-get.sh
initial = 1
hook-0 = $HOME/dotfiles/polybar/scripts/brightness-get.sh
scroll-up = $HOME/dotfiles/polybar/scripts/brightness-control.sh up
scroll-down = $HOME/dotfiles/polybar/scripts/brightness-control.sh down

[module/launcher]
type = custom/text
content = " "
click-left = rofi -show drun &
content-foreground = ${color.background}
content-background = ${color.orange}
content-padding = 1

[module/powermenu]
type = custom/text
content = " "
content-foreground = ${color.foreground}
click-left = $HOME/dotfiles/polybar/scripts/powermenu.sh &
content-background = ${color.red}
content-padding = 1

[module/stats-show]
type = custom/text
content = " "
click-left = $HOME/dotfiles/polybar/scripts/show-stats.sh
content-background = ${color.aqua}
content-padding = 1

[module/stats-hide]
type = custom/text
content = " "
click-left = $HOME/dotfiles/polybar/scripts/hide-stats.sh
content-background = ${color.aqua}
content-padding = 1
