include-file = $HOME/dotfiles/polybar/colors.ini
include-file = $HOME/dotfiles/polybar/separators.ini
include-file = $HOME/dotfiles/polybar/modules.ini
include-file = $HOME/dotfiles/polybar/user_modules.ini

[bar/main]
monitor = eDP
monitor-fallback =
monitor-strict = false
override-redirect = false
enable-ipc = true
bottom = false
fixed-center = true
width = 100%
height = 20
offset-x = 0
offset-y = 0
padding = 0
module-margin-left = 0
module-margin-right = 0
background = ${color.background}
foreground = ${color.foreground}
font-0 = "CaskaydiaCove Nerd Font:pixelsize=9;2.5"
font-1 = "CaskaydiaCove Nerd Font:pixelsize=20;0"
locale = en_US.UTF-8
separator =
tray-position = none

[bar/primary]
inherit = bar/main
modules-left = launcher sep-left-1 workspaces
modules-right = battery sep bluetooth sep user_network sep brightness sep volume sep date sep-right-2 stats-show sep-right-1 powermenu

[bar/stats]
inherit = bar/main
modules-left = launcher sep-left-1 workspaces
modules-right = filesystem sep battery sep cpu sep memory sep temperature sep bluetooth sep user_network sep brightness sep volume sep date sep-right-2 stats-hide sep-right-1 powermenu

[settings]
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
